[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-digest"
version = "0.1.0"
description = "Hierarchical Map-Reduce document summarizer and executive intelligence synthesizer."
readme = "README.md"
authors = [
    { name = "Afsal", email = "afsalkp.mohammed@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.28.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
]
